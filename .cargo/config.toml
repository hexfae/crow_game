[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-Clink-arg=-fuse-ld=wild", "-Zshare-generics=y", "-Zthreads=0"]

[unstable]
codegen-backend = true

[profile.dev]
codegen-backend = "cranelift"
opt-level = 1

[profile.dev.package."*"]
codegen-backend = "llvm"
opt-level = 3
debug = false

[profile.release]
codegen-units = 1
lto = "thin"

[profile.wasm-release]
inherits = "release"
opt-level = "s"
strip = "debuginfo"
