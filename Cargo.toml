[package]
name = "crow_game"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.18.1", default-features = false, features = [
  "default_app",
  "std",
  "multi_threaded",
  "bevy_winit",
  "wayland",
  "3d_bevy_render",
] }
log = { version = "*", features = [
  "max_level_debug",
  "release_max_level_warn",
] }
rand = "0.10.1"
bevy_enhanced_input = "0.24.4"

[features]
dev = [
  "bevy/debug",
  "bevy/dynamic_linking",
  "bevy/hotpatching",
  "bevy/file_watcher",
  "bevy/sysinfo_plugin",
]
